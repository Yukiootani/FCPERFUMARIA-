<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entrar | ClickVenda Pro</title>
    
    <link rel="apple-touch-icon" href="663adacb-9398-45a8-9e83-f0dcf0e1f4ef.png">
    <link rel="icon" type="image/png" href="663adacb-9398-45a8-9e83-f0dcf0e1f4ef.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #1B263B;
            --gold: #Cca43b;
            --white: #ffffff;
            --card-bg: #ffffff;
            --text-dark: #1f2937;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, #2c3e50 0%, #1B263B 100%);
            color: var(--white);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 25px;
        }

        /* TELA DE LOGIN (Inicial) */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            text-align: center;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .login-box h2 { color: var(--bg-color); margin-top: 0; }
        .login-box input {
            width: 100%; padding: 15px; margin-bottom: 15px;
            border: 1px solid #ddd; border-radius: 8px; font-size: 1em; box-sizing: border-box;
        }
        .login-btn {
            width: 100%; padding: 15px; background: var(--gold); color: white;
            border: none; border-radius: 8px; font-weight: bold; font-size: 1.1em; cursor: pointer;
        }

        /* DASHBOARD (Escondido inicialmente) */
        #dashboard-screen { display: none; flex-direction: column; height: 100%; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; margin-top: 10px; }
        .user-info h2 { margin: 0; font-size: 1.8em; font-weight: 700; }
        .user-info p { margin: 5px 0 0 0; color: var(--gold); font-size: 0.95em; font-weight: 600; text-transform: uppercase; }
        .profile-icon { width: 50px; height: 50px; border: 2px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4em; }

        .dashboard-grid { display: grid; gap: 18px; margin-bottom: 30px; }
        .dash-card { background: var(--card-bg); border-radius: 12px; padding: 22px; text-decoration: none; color: var(--text-dark); display: flex; align-items: center; position: relative; overflow: hidden; border-left: 5px solid transparent; }
        .card-admin { border-left-color: var(--gold); }
        .card-stock { border-left-color: #3b82f6; }
        .card-shop { border-left-color: #10b981; }
        .card-icon { width: 55px; height: 55px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.6em; margin-right: 18px; }
        .icon-admin-bg { background: #fffbeb; color: #d97706; }
        .icon-stock-bg { background: #eff6ff; color: #3b82f6; }
        .icon-shop-bg { background: #ecfdf5; color: #10b981; }
        .card-info h3 { margin: 0 0 6px 0; font-size: 1.15em; font-weight: 700; color: var(--bg-color); }
        .card-info p { margin: 0; font-size: 0.85em; color: #6b7280; font-weight: 500; }
        .arrow-right { margin-left: auto; color: #d1d5db; font-size: 1.2em; }

        .notepad-section { background: var(--card-bg); border-radius: 12px; padding: 20px; flex-grow: 1; display: flex; flex-direction: column; margin-bottom: 20px; }
        #notepad-area { width: 100%; min-height: 120px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 15px; font-family: sans-serif; resize: none; outline: none; }
        
        footer { margin-top: auto; text-align: center; padding-bottom: 20px; }
        .logout-btn { color: #f87171; text-decoration: none; font-size: 0.9em; font-weight: bold; cursor: pointer; }

    </style>
</head>
<body>

    <div id="login-screen">
        <div style="margin-bottom: 30px;">
            <i class="fa-solid fa-rocket" style="font-size: 50px; color: var(--gold);"></i>
            <h1 style="margin: 10px 0;">ClickVenda Pro</h1>
        </div>
        <div class="login-box">
            <h2>Acesso do Parceiro</h2>
            <form id="loginForm">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="senha" placeholder="Senha" required>
                <button type="submit" class="login-btn">ENTRAR NO SISTEMA</button>
            </form>
            <p id="login-msg" style="color: red; display: none; margin-top: 10px;"></p>
        </div>
    </div>

    <div id="dashboard-screen">
        <header>
            <div class="user-info">
                <h2 id="greeting">Olá!</h2>
                <p>Gestão FC Perfumaria</p>
            </div>
            <div class="profile-icon"><i class="fa-solid fa-user-shield"></i></div>
        </header>

        <div class="dashboard-grid">
            <a href="admin.html" class="dash-card card-admin">
                <div class="card-icon icon-admin-bg"><i class="fa-solid fa-sliders"></i></div>
                <div class="card-info"><h3>Administração</h3><p>Cadastros e Push</p></div>
                <i class="fa-solid fa-chevron-right arrow-right"></i>
            </a>

            <a href="estoque.html" class="dash-card card-stock">
                <div class="card-icon icon-stock-bg"><i class="fa-solid fa-boxes-stacked"></i></div>
                <div class="card-info"><h3>Estoque Rápido</h3><p>Controle Diário</p></div>
                <i class="fa-solid fa-chevron-right arrow-right"></i>
            </a>

            <a href="index.html" class="dash-card card-shop">
                <div class="card-icon icon-shop-bg"><i class="fa-solid fa-store"></i></div>
                <div class="card-info"><h3>Minha Loja</h3><p>Ver Site Online</p></div>
                <i class="fa-solid fa-chevron-right arrow-right"></i>
            </a>
        </div>

        <div class="notepad-section">
            <h3 style="color:#1B263B; margin-top:0;"><i class="fa-solid fa-pen"></i> Anotações <span id="save-status" style="font-size:0.7em; color:green; float:right;"></span></h3>
            <textarea id="notepad-area" placeholder="Digite seus lembretes aqui..."></textarea>
        </div>

        <footer>
            <div onclick="doLogout()" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Sair do Aplicativo</div>
            <br>
            <span style="font-size: 0.7em; color: rgba(255,255,255,0.3);">v2.3 System</span>
        </footer>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDxyqFLm08rqlaemlyYI9gQfrjvddPelJs", authDomain: "fc-perfumaria-309fb.firebaseapp.com", projectId: "fc-perfumaria-309fb", storageBucket: "fc-perfumaria-309fb.firebasestorage.app", messagingSenderId: "311935363734", appId: "1:311935363734:web:a85cf6ccd93c67d594f0b7" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const loginScreen = document.getElementById('login-screen');
        const dashScreen = document.getElementById('dashboard-screen');

        // VERIFICAR LOGIN
        auth.onAuthStateChanged(user => {
            if (user) {
                loginScreen.style.display = 'none';
                dashScreen.style.display = 'flex';
            } else {
                loginScreen.style.display = 'flex';
                dashScreen.style.display = 'none';
            }
        });

        // FAZER LOGIN
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('senha').value;
            const msg = document.getElementById('login-msg');
            
            try {
                await auth.signInWithEmailAndPassword(email, pass);
            } catch (error) {
                msg.textContent = "Senha incorreta ou email inválido.";
                msg.style.display = 'block';
            }
        });

        // LOGOUT
        window.doLogout = () => auth.signOut();

        // SAUDAÇÃO & BLOCO DE NOTAS
        const h = new Date().getHours();
        document.getElementById('greeting').textContent = h<12?'Bom dia!':h<18?'Boa tarde!':'Boa noite!';
        
        const note = document.getElementById('notepad-area');
        const st = document.getElementById('save-status');
        note.value = localStorage.getItem('notes') || '';
        let t;
        note.addEventListener('input', ()=>{
            st.textContent='Salvando...'; clearTimeout(t);
            t=setTimeout(()=>{ localStorage.setItem('notes', note.value); st.textContent='Salvo ✓'; }, 500);
        });
    </script>
</body>
</html>
