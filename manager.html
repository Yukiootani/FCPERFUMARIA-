<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel do Parceiro | ClickVenda Pro</title>
    
    <link rel="apple-touch-icon" href="663adacb-9398-45a8-9e83-f0dcf0e1f4ef.png">
    <link rel="icon" type="image/png" href="663adacb-9398-45a8-9e83-f0dcf0e1f4ef.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- ESTILO EXECUTIVO (ALTO CONTRASTE) --- */
        :root {
            --bg-color: #1B263B;    /* Azul Marinho FC */
            --gold: #Cca43b;        /* Dourado FC */
            --white: #ffffff;
            --card-bg: #ffffff;
            --text-dark: #1f2937;
            --text-grey: #6b7280;
            --success: #10b981;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, #2c3e50 0%, #1B263B 100%);
            color: var(--white);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 25px;
        }

        /* CABEÇALHO */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            margin-top: 10px;
        }

        .user-info h2 { margin: 0; font-size: 1.8em; font-weight: 700; }
        .user-info p { margin: 5px 0 0 0; color: var(--gold); font-size: 0.95em; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
        
        .profile-icon {
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4em;
            color: var(--white);
            box-shadow: 0 0 15px rgba(204, 164, 59, 0.3);
        }

        /* GRID DE BOTÕES */
        .dashboard-grid {
            display: grid;
            gap: 18px;
            margin-bottom: 30px;
        }

        .dash-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 22px;
            text-decoration: none;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            transition: transform 0.2s;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow);
            border-left: 5px solid transparent;
        }

        .dash-card:active { transform: scale(0.97); background: #f3f4f6; }
        
        /* Cores das Bordas Laterais */
        .card-admin { border-left-color: var(--gold); }
        .card-stock { border-left-color: #3b82f6; }
        .card-shop { border-left-color: var(--success); }

        .card-icon {
            width: 55px; height: 55px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6em;
            margin-right: 18px;
            flex-shrink: 0;
        }

        /* Cores dos Ícones */
        .icon-admin-bg { background: #fffbeb; color: #d97706; }
        .icon-stock-bg { background: #eff6ff; color: #3b82f6; }
        .icon-shop-bg { background: #ecfdf5; color: #10b981; }

        .card-info h3 { margin: 0 0 6px 0; font-size: 1.15em; font-weight: 700; color: var(--bg-color); }
        .card-info p { margin: 0; font-size: 0.85em; color: var(--text-grey); line-height: 1.4; font-weight: 500; }

        .arrow-right { margin-left: auto; color: #d1d5db; font-size: 1.2em; }

        /* BLOCO DE NOTAS */
        .notepad-section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            flex-grow: 1; 
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .notepad-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
            border-bottom: 1px solid #eee; padding-bottom: 10px;
        }
        .notepad-header h3 { margin: 0; font-size: 1em; color: var(--bg-color); text-transform: uppercase; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        
        #notepad-area {
            width: 100%;
            height: 100%;
            min-height: 120px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            color: var(--text-dark);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95em;
            line-height: 1.6;
            resize: none;
            outline: none;
            padding: 15px;
        }
        #notepad-area:focus { border-color: var(--gold); background: #fff; }

        /* RODAPÉ */
        footer {
            margin-top: 10px;
            text-align: center;
        }
        .support-btn {
            display: inline-flex; align-items: center; gap: 10px;
            background: rgba(255,255,255,0.15);
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            color: var(--white);
            font-size: 0.9em;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.2);
            transition: 0.3s;
        }
        .support-btn:hover { background: var(--gold); color: var(--bg-color); border-color: var(--gold); }
        
        .version { display: block; margin-top: 15px; font-size: 0.75em; color: rgba(255,255,255,0.4); }

    </style>
</head>
<body>

    <header>
        <div class="user-info">
            <h2 id="greeting">Olá!</h2>
            <p>Gestão FC Perfumaria</p>
        </div>
        <div class="profile-icon">
            <i class="fa-solid fa-user-shield"></i>
        </div>
    </header>

    <div class="dashboard-grid">
        <a href="admin.html" class="dash-card card-admin">
            <div class="card-icon icon-admin-bg"><i class="fa-solid fa-sliders"></i></div>
            <div class="card-info">
                <h3>Administração</h3>
                <p>Cadastros e Notificações</p>
            </div>
            <i class="fa-solid fa-chevron-right arrow-right"></i>
        </a>

        <a href="estoque.html" class="dash-card card-stock">
            <div class="card-icon icon-stock-bg"><i class="fa-solid fa-boxes-stacked"></i></div>
            <div class="card-info">
                <h3>Estoque Rápido</h3>
                <p>Controle de Vendas Diário</p>
            </div>
            <i class="fa-solid fa-chevron-right arrow-right"></i>
        </a>

        <a href="index.html" class="dash-card card-shop">
            <div class="card-icon icon-shop-bg"><i class="fa-solid fa-store"></i></div>
            <div class="card-info">
                <h3>Minha Loja</h3>
                <p>Visualizar Site Online</p>
            </div>
            <i class="fa-solid fa-chevron-right arrow-right"></i>
        </a>
    </div>

    <div class="notepad-section">
        <div class="notepad-header">
            <h3><i class="fa-solid fa-pen-to-square" style="color:var(--gold)"></i> Notas Pessoais</h3>
            <span style="font-size: 0.75em; color: var(--success); font-weight:bold;" id="save-status"></span>
        </div>
        <textarea id="notepad-area" placeholder="Escreva aqui lembretes, lista de compras ou tarefas... (Salvo automaticamente no seu celular)"></textarea>
    </div>

    <footer>
        <a href="https://wa.me/818074558624" class="support-btn">
            <i class="fa-brands fa-whatsapp" style="font-size: 1.2em;"></i> Suporte Técnico
        </a>
        <span class="version">ClickVenda Pro • v2.2 (SaaS)</span>
    </footer>

    <script>
        // 1. SAUDAÇÃO INTELIGENTE
        const hour = new Date().getHours();
        const greetingElement = document.getElementById('greeting');
        let greetingText = 'Olá!';
        
        if (hour >= 5 && hour < 12) greetingText = 'Bom dia!';
        else if (hour >= 12 && hour < 18) greetingText = 'Boa tarde!';
        else greetingText = 'Boa noite!';
        
        greetingElement.textContent = greetingText;

        // 2. BLOCO DE NOTAS (LOCAL STORAGE)
        const notepad = document.getElementById('notepad-area');
        const statusSpan = document.getElementById('save-status');
        
        // Carregar nota salva ao abrir
        const savedNote = localStorage.getItem('clickvenda_notes');
        if (savedNote) {
            notepad.value = savedNote;
        }

        // Salvar ao digitar
        let timeout = null;
        notepad.addEventListener('input', () => {
            statusSpan.textContent = 'Salvando...';
            statusSpan.style.color = '#ccc';
            clearTimeout(timeout);
            
            // Espera o usuário parar de digitar por 0.5s para salvar
            timeout = setTimeout(() => {
                localStorage.setItem('clickvenda_notes', notepad.value);
                statusSpan.textContent = 'Salvo com sucesso ✓';
                statusSpan.style.color = '#10b981';
                setTimeout(() => { statusSpan.textContent = ''; }, 2000);
            }, 500);
        });
    </script>
</body>
</html>
