<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel do Parceiro | ClickVenda Pro</title>
    
    <link rel="apple-touch-icon" href="663adacb-9398-45a8-9e83-f0dcf0e1f4ef.png">
    <link rel="icon" type="image/png" href="663adacb-9398-45a8-9e83-f0dcf0e1f4ef.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- ESTILO PREMIUM DARK --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --accent-gold: #fbbf24; /* Dourado Premium */
            --accent-blue: #38bdf8;
            --danger: #f87171;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* CABEÇALHO */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            margin-top: 10px;
        }

        .user-info h2 { margin: 0; font-size: 1.5em; font-weight: 800; }
        .user-info p { margin: 0; color: var(--accent-gold); font-size: 0.9em; font-weight: 500; letter-spacing: 0.5px; }
        
        .profile-icon {
            width: 45px; height: 45px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2em;
            color: var(--text-muted);
        }

        /* GRID DE BOTÕES */
        .dashboard-grid {
            display: grid;
            gap: 15px;
            margin-bottom: 30px;
        }

        .dash-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            transition: transform 0.2s, background 0.3s;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .dash-card:active { transform: scale(0.98); background: rgba(255,255,255,0.12); }
        
        .card-icon {
            width: 50px; height: 50px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5em;
            margin-right: 15px;
            flex-shrink: 0;
        }

        /* Cores dos Ícones */
        .icon-admin { background: rgba(251, 191, 36, 0.2); color: #fbbf24; }
        .icon-stock { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
        .icon-shop { background: rgba(16, 185, 129, 0.2); color: #34d399; }

        .card-info h3 { margin: 0 0 5px 0; font-size: 1.1em; font-weight: 600; }
        .card-info p { margin: 0; font-size: 0.8em; color: var(--text-muted); line-height: 1.3; }

        .arrow-right { margin-left: auto; color: var(--text-muted); opacity: 0.5; }

        /* BLOCO DE NOTAS */
        .notepad-section {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            flex-grow: 1; /* Ocupa o espaço restante */
            display: flex;
            flex-direction: column;
        }

        .notepad-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
        }
        .notepad-header h3 { margin: 0; font-size: 1em; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        
        #notepad-area {
            width: 100%;
            height: 100%;
            min-height: 150px;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 1em;
            line-height: 1.6;
            resize: none;
            outline: none;
        }
        #notepad-area::placeholder { color: rgba(255,255,255,0.2); }

        /* RODAPÉ */
        footer {
            margin-top: 30px;
            text-align: center;
        }
        .support-btn {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.05);
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.8em;
            border: 1px solid var(--card-border);
            transition: 0.3s;
        }
        .support-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        
        .version { display: block; margin-top: 15px; font-size: 0.7em; color: rgba(255,255,255,0.2); }

    </style>
</head>
<body>

    <header>
        <div class="user-info">
            <h2 id="greeting">Olá!</h2>
            <p>Gestão FC Perfumaria</p>
        </div>
        <div class="profile-icon">
            <i class="fa-solid fa-user-tie"></i>
        </div>
    </header>

    <div class="dashboard-grid">
        <a href="admin.html" class="dash-card">
            <div class="card-icon icon-admin"><i class="fa-solid fa-sliders"></i></div>
            <div class="card-info">
                <h3>Administração</h3>
                <p>Cadastrar perfumes e mandar notificações.</p>
            </div>
            <i class="fa-solid fa-chevron-right arrow-right"></i>
        </a>

        <a href="estoque.html" class="dash-card">
            <div class="card-icon icon-stock"><i class="fa-solid fa-boxes-stacked"></i></div>
            <div class="card-info">
                <h3>Estoque Rápido</h3>
                <p>Vendeu? Baixe aqui. Controle do dia a dia.</p>
            </div>
            <i class="fa-solid fa-chevron-right arrow-right"></i>
        </a>

        <a href="index.html" class="dash-card">
            <div class="card-icon icon-shop"><i class="fa-solid fa-store"></i></div>
            <div class="card-info">
                <h3>Minha Loja</h3>
                <p>Ver o site como o cliente vê.</p>
            </div>
            <i class="fa-solid fa-chevron-right arrow-right"></i>
        </a>
    </div>

    <div class="notepad-section">
        <div class="notepad-header">
            <h3><i class="fa-regular fa-note-sticky"></i> Anotações Rápidas</h3>
            <span style="font-size: 0.7em; color: #fbbf24;" id="save-status"></span>
        </div>
        <textarea id="notepad-area" placeholder="Digite aqui lembretes, pedidos de fornecedor ou ideias... (Salvo automaticamente)"></textarea>
    </div>

    <footer>
        <a href="https://wa.me/819012345678" class="support-btn">
            <i class="fa-brands fa-whatsapp"></i> Falar com Suporte Técnico
        </a>
        <span class="version">ClickVenda Pro • v2.1 (SaaS)</span>
    </footer>

    <script>
        // 1. SAUDAÇÃO INTELIGENTE
        const hour = new Date().getHours();
        const greetingElement = document.getElementById('greeting');
        let greetingText = 'Olá!';
        
        if (hour >= 5 && hour < 12) greetingText = 'Bom dia!';
        else if (hour >= 12 && hour < 18) greetingText = 'Boa tarde!';
        else greetingText = 'Boa noite!';
        
        greetingElement.textContent = greetingText;

        // 2. BLOCO DE NOTAS (LOCAL STORAGE)
        const notepad = document.getElementById('notepad-area');
        const statusSpan = document.getElementById('save-status');
        
        // Carregar nota salva ao abrir
        const savedNote = localStorage.getItem('clickvenda_notes');
        if (savedNote) {
            notepad.value = savedNote;
        }

        // Salvar ao digitar
        let timeout = null;
        notepad.addEventListener('input', () => {
            statusSpan.textContent = 'Salvando...';
            clearTimeout(timeout);
            
            // Espera o usuário parar de digitar por 0.5s para salvar
            timeout = setTimeout(() => {
                localStorage.setItem('clickvenda_notes', notepad.value);
                statusSpan.textContent = 'Salvo ✓';
                setTimeout(() => { statusSpan.textContent = ''; }, 2000);
            }, 500);
        });

    </script>
</body>
</html>
